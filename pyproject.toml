[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nemr-ui-cloner"
version = "3.0.0"
description = "Design Token & Palette Synthesizer, WCAG & A11y UI Auditor, HTML DOM-to-Flutter/Tailwind Transpiler & RTL/Logical CSS Adapter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mahmoud ElNeMeR", email = "contact@elnemer-ai.com" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/ElNeMeR70/nemr-ui-cloner"
Repository = "https://github.com/ElNeMeR70/nemr-ui-cloner"

[project.scripts]
nemr-ui = "cli:main"

[tool.setuptools]
py-modules = ["cli"]
packages = ["core"]
